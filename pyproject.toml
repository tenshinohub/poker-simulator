[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-simulator"
version = "0.1.0"
description = "Modular Texas Hold'em cash-game simulator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
poker-sim = "poker_sim.ui.cli:main"
poker-analyze = "poker_sim.llm.cli:main"
poker-validate = "poker_sim.llm.validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
llm = ["google-genai>=1.0"]
